[project]
name = "cvyne-api"
version = "0.1.0"
description = "AutoApply AI — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # AI / LLM — litellm = unified API for 100+ providers (handles Anthropic,
    # OpenAI, Gemini, Ollama, Bedrock, Azure, etc. with fallback + cost tracking)
    "litellm>=1.55.0",
    "instructor>=1.7.0",   # structured Pydantic output across providers
    "langfuse>=2.0.0",     # tracing — wired automatically as litellm callback

    # Web scraping for fast-path JD extraction (cheaper than browser-use)
    "crawl4ai>=0.4.0",

    # Browser Automation — https://github.com/browser-use/browser-use
    # browser-use ships its own LLM clients (ChatBrowserUse, ChatAnthropic,
    # ChatOpenAI, ChatGoogle) — DO NOT add LangChain wrappers.
    "browser-use>=0.1.0",
    "playwright>=1.49.0",

    # Design Engine — https://github.com/nexu-io/open-design
    # NOT a Python library. Runs as a TypeScript daemon (sidecar) that we call
    # over HTTP. Started via docker compose --profile full or cloned separately.
    # Local PDF rendering fallback when daemon is unreachable:
    "weasyprint>=63.0",

    # Templates
    "jinja2>=3.1.4",

    # Resume file parsing (PDF/DOCX upload)
    "pymupdf4llm>=0.0.17",  # LLM-friendly markdown extraction from PDFs
    "python-docx>=1.1.0",   # .docx parsing

    # Queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Storage
    "aioboto3>=13.2.0",

    # Security
    "cryptography>=44.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",

    # Observability
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
