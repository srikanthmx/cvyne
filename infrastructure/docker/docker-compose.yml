version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvyne
      POSTGRES_PASSWORD: cvyne
      POSTGRES_DB: cvyne
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvyne"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  flower:
    # Celery monitoring dashboard — http://localhost:5555
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  open-design:
    # https://github.com/nexu-io/open-design
    # TypeScript daemon that produces design artifacts via agent CLIs.
    # Built locally because there is no published image yet.
    build:
      context: https://github.com/nexu-io/open-design.git
      dockerfile: Dockerfile
    ports:
      - "4477:4477"
    environment:
      OPEN_DESIGN_PORT: 4477
      OPEN_DESIGN_DATA_DIR: /data
      # BYOK proxy receives provider keys per-request — none stored here
    volumes:
      - open_design_data:/data
    restart: unless-stopped
    profiles: ["full"]  # opt-in: requires `--profile full`

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Optional: uncomment to enable LLM observability locally
  # langfuse:
  #   image: langfuse/langfuse:latest
  #   ports:
  #     - "3030:3000"
  #   environment:
  #     DATABASE_URL: postgresql://cvyne:cvyne@postgres:5432/langfuse
  #     NEXTAUTH_URL: http://localhost:3030
  #     NEXTAUTH_SECRET: changeme
  #     SALT: changeme
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  open_design_data:
